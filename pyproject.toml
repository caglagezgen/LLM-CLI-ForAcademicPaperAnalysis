[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-qa-cli"
version = "0.1.0"
description = "Paper-grounded CLI for academic paper analysis with Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.4,<6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<0.12",
  "mypy>=1.9,<2.0",
]

[project.scripts]
paper-qa = "paper_qa_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D", "ANN"]
ignore = ["D100", "D104", "D203", "D212", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"